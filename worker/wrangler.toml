name = "blog-test1-admin-api"
main = "src/index.js"
compatibility_date = "2026-08-12"

# 部署后将此地址填入 GitHub Pages 构建变量 PUBLIC_ADMIN_SYNC_API_URL。
# routes 不绑定主站，避免把管理 API 混入静态站点。

[[kv_namespaces]]
binding = "SESSIONS"
id = "ee8558b9d22f4ad59759a3c4917befb6"

[vars]
ALLOWED_ORIGIN = "https://ice11123.github.io"
GITHUB_OWNER = "ice11123"
GITHUB_REPO = "blog_test1"
GITHUB_BRANCH = "main"

# Secret（使用 wrangler secret put 设置，绝不提交到仓库）：
# GITHUB_OAUTH_CLIENT_ID
# GITHUB_OAUTH_CLIENT_SECRET
# SESSION_SECRET
